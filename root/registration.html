<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SII | Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    /* Navbar */
    .navbar {
      background: #004aad;
      padding: 0.8em 2em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar .logo img {
      height: 50px;
    }

    .navbar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 1.5em;
    }

    .navbar ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .navbar ul li a:hover {
      color: #e60000;
    }

    .navbar ul li a.active {
      color: #e60000;
    }

    /* Register Box */
    .container {
      background: white;
      padding: 2em;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 340px;
      margin: 5% auto;
      text-align: center;
    }

    h2 {
      color: #004aad;
      margin: 0 0 1em;
    }

    .form-container input {
      width: 100%;
      padding: 0.6em;
      margin-bottom: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.95em;
    }

    .form-container button {
      width: 100%;
      padding: 0.8em;
      background: #004aad;
      color: white;
      font-size: 1em;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .form-container button:hover {
      background: #002f73;
    }

    .message {
      margin-top: 1em;
      font-size: 0.9em;
      font-weight: bold;
    }

    .footer {
      margin-top: 1.5em;
      font-size: 0.8em;
      color: #777;
    }

    .footer span {
      color: #e60000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="Screenshot 2025-09-27 162059.png" alt="SII Logo" />
    </div>
    <ul>
      <li><a href="https://www.seruminstitute.com/index.php">Home</a></li>
      <li><a href="https://www.seruminstitute.com/about_us.php">About Us</a></li>
      <li><a href="#" class="active">Register</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <!-- Register Form -->
  <div class="container">
    <h2>Register</h2>
    <form id="regForm" class="form-container">
      <input type="text" id="name" name="name" placeholder="Full Name" required />
      <input type="email" id="email" name="email" placeholder="Email" required />
      <input type="password" id="password" name="password" placeholder="Password" required />
      <button type="submit">Submit</button>
    </form>

    <div class="message" id="message"></div>

    <div class="footer">
      © 2025 <span>Serum Institute of India Pvt. Ltd.</span>
    </div>
  </div>

  <script>
    const form = document.getElementById("regForm");
    const msgDiv = document.getElementById("message");

    // 🔹 Replace with your actual Apps Script Web App URL
    const scriptURL = "https://script.google.com/macros/s/AKfycby5-b_M4fcmwhrbxVec63wPH3z1hse2WECwDPDh4hhLSSRrI78PCHBeOnaIhwmEJ4B-/exec";

    form.addEventListener("submit", e => {
      e.preventDefault();
      const data = new URLSearchParams(new FormData(form));

      fetch(scriptURL, { method: "POST", body: data })
        .then(async response => {
          try {
            return await response.json(); // Expect JSON
          } catch {
            const text = await response.text(); // Fallback for non-JSON
            throw new Error("Non-JSON response: " + text);
          }
        })
        .then(r => {
          if (r.result === "success") {
            msgDiv.style.color = "green";
            msgDiv.textContent = "✅ Registration successful!";
            form.reset();
          } else {
            msgDiv.style.color = "red";
            msgDiv.textContent = "❌ Error: " + (r.error || "Unknown error occurred.");
          }
        })
        .catch(err => {
          msgDiv.style.color = "red";
          msgDiv.textContent = "⚠️ Fetch error: " + err.message;
        });
    });
  </script>
</body>
</html>
